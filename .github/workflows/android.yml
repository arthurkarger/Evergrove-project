name: Android APK
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/blender-assets.yml'
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot and official export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.4.1-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$BASE/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot-templates/templates/version.txt "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          godot --version
      - name: Configure export and debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Generate Blender game models
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --background --factory-startup --python-exit-code 1 --python tools/generate_blender_assets.py -- --game-assets
          for model in house_628693 house_946e57 house_96778c house_577453 house_b76349 house_597e80 house_84905d tree pine fruit_tree bench character_head character_torso character_limb character_shoe character_hair; do
            test -s "assets/models/generated/$model.glb"
          done
      - name: Import project
        shell: bash
        run: godot --headless --editor --path . --import
      - name: Verify imported Blender models are used in game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/blender_models.gd 2>&1 | tee "$RUNNER_TEMP/blender-models.log"
          grep -Fx 'Blender model integration failures: 0' "$RUNNER_TEMP/blender-models.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/blender-models.log"; then exit 1; fi
      - name: Check village startup
        shell: bash
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/evergrove-startup.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-startup.log"; then exit 1; fi
      - name: Verify Village Life interactions and save migration
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-test-profile
        run: |
          godot --headless --path . --script res://tests/village_life.gd 2>&1 | tee "$RUNNER_TEMP/village-life-test.log"
          grep -Fx 'Village Life integration failures: 0' "$RUNNER_TEMP/village-life-test.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/village-life-test.log"; then exit 1; fi
      - name: Verify house, construction and storage
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-home-profile
        run: |
          godot --headless --path . --script res://tests/home.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-home.log"
          grep -Fx 'Home integration failures: 0' "$RUNNER_TEMP/evergrove-home.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-home.log"; then exit 1; fi
      - name: Verify pause menu and graphics presets
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-graphics-profile
        run: |
          godot --headless --path . --script res://tests/graphics.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-graphics.log"
          grep -Fx 'Graphics integration failures: 0' "$RUNNER_TEMP/evergrove-graphics.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-graphics.log"; then exit 1; fi
      - name: Export APK
        shell: bash
        run: |
          godot --headless --verbose --path . --export-debug Android build/evergrove.apk
          test -s build/evergrove.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify build/evergrove.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Evergrove-Android
          path: build/evergrove.apk
          if-no-files-found: error
