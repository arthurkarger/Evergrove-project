name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/blender-assets.yml'
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Godot and official export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.4.1-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$BASE/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp /tmp/godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp /tmp/godot-templates/templates/version.txt "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          godot --version
      - name: Configure Android export tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Generate Blender game models
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --background --factory-startup --python-exit-code 1 --python tools/generate_blender_assets.py -- --game-assets
          for model in house_628693 house_946e57 house_96778c house_577453 house_b76349 house_597e80 house_84905d tree pine fruit_tree bench character_head character_torso character_limb character_shoe character_hair; do
            test -s "assets/models/generated/$model.glb"
          done
      - name: Import project
        shell: bash
        run: |
          godot --headless --editor --path . --import
          python3 tools/compress_model_textures.py
          godot --headless --editor --path . --import
      - name: Verify imported Blender models are used in game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/blender_models.gd 2>&1 | tee "$RUNNER_TEMP/blender-models.log"
          grep -Fx 'Blender model integration failures: 0' "$RUNNER_TEMP/blender-models.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/blender-models.log"; then exit 1; fi
      - name: Check village startup
        shell: bash
        run: |
          godot --headless --path . --quit-after 10 2>&1 | tee "$RUNNER_TEMP/evergrove-startup.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-startup.log"; then exit 1; fi
      - name: Verify Village Life interactions and save migration
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-test-profile
        run: |
          godot --headless --path . --script res://tests/village_life.gd 2>&1 | tee "$RUNNER_TEMP/village-life-test.log"
          grep -Fx 'Village Life integration failures: 0' "$RUNNER_TEMP/village-life-test.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/village-life-test.log"; then exit 1; fi
      - name: Verify house, construction and storage
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-home-profile
        run: |
          godot --headless --path . --script res://tests/home.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-home.log"
          grep -Fx 'Home integration failures: 0' "$RUNNER_TEMP/evergrove-home.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-home.log"; then exit 1; fi
      - name: Verify polished HUD and dialogue
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-polish-profile
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/polish.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-polish.log"
          grep -Fx 'Polish integration failures: 0' "$RUNNER_TEMP/evergrove-polish.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-polish.log"; then exit 1; fi
      - name: Verify title menu, options and game transition
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-title-profile
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/title.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-title.log"
          grep -Fx 'Title menu integration failures: 0' "$RUNNER_TEMP/evergrove-title.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-title.log"; then exit 1; fi
      - name: Verify pause menu and graphics presets
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-graphics-profile
        run: |
          godot --headless --path . --script res://tests/graphics.gd 2>&1 | tee "$RUNNER_TEMP/evergrove-graphics.log"
          grep -Fx 'Graphics integration failures: 0' "$RUNNER_TEMP/evergrove-graphics.log"
          if grep -E '^(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/evergrove-graphics.log"; then exit 1; fi
      - name: Export and verify signed release APK
        shell: bash
        env:
          EVERGROVE_KEYSTORE_BASE64: ${{ secrets.EVERGROVE_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.EVERGROVE_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: evergrove
        run: |
          set -euo pipefail
          if [[ -z "$EVERGROVE_KEYSTORE_BASE64" || -z "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]]; then
            echo "::error::Configure EVERGROVE_KEYSTORE_BASE64 and EVERGROVE_KEYSTORE_PASSWORD in repository Actions secrets before publishing."
            exit 1
          fi
          umask 077
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/evergrove-release.p12"
          trap 'rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"' EXIT
          printf '%s' "$EVERGROVE_KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          unset EVERGROVE_KEYSTORE_BASE64
          keytool -list -alias evergrove -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass:env GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD >/dev/null
          godot --headless --path . --export-release Android build/evergrove.apk
          test -s build/evergrove.apk
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$SIGNER" verify --print-certs build/evergrove.apk | tee "$RUNNER_TEMP/evergrove-certificate.txt"
          grep -Fxi 'Signer #1 certificate SHA-256 digest: 6893ff2d02148e789b36c9bfc08509bd9dee2033a6c89cf00a48636e916d4587' "$RUNNER_TEMP/evergrove-certificate.txt"
          "$AAPT" dump xmltree build/evergrove.apk AndroidManifest.xml > "$RUNNER_TEMP/evergrove-manifest.txt"
          python3 - "$RUNNER_TEMP/evergrove-manifest.txt" <<'PY'
          import pathlib, re, sys
          manifest = pathlib.Path(sys.argv[1]).read_text()
          preset = dict(line.split("=", 1) for line in pathlib.Path("export_presets.cfg").read_text().splitlines() if "=" in line)
          expected_code = int(preset["version/code"])
          expected_name = preset["version/name"].strip('"')

          def attribute(name):
              match = re.search(r'^\s*A:\s+' + re.escape(name) + r'(?:\([^)]*\))?=(.*)$', manifest, re.M)
              return match.group(1).strip() if match else None

          def string_value(name):
              value = attribute(name)
              match = re.match(r'"([^"]*)"', value or "")
              if not match:
                  sys.exit("Missing or invalid manifest attribute: " + name)
              return match.group(1)

          def integer_value(name):
              value = attribute(name)
              match = re.fullmatch(r'\(type 0x[0-9a-fA-F]+\)\s*(0x[0-9a-fA-F]+|\d+)', value or "")
              if not match:
                  sys.exit("Missing or invalid manifest integer: " + name)
              return int(match.group(1), 0)

          if string_value("package") != "com.evergrove.game":
              sys.exit("Unexpected package name")
          if integer_value("android:versionCode") != expected_code:
              sys.exit("Unexpected versionCode")
          if string_value("android:versionName") != expected_name:
              sys.exit("Unexpected versionName")
          if attribute("android:debuggable") is not None and integer_value("android:debuggable") != 0:
              sys.exit("Refusing to publish a debuggable APK")
          print(f"Verified release manifest: com.evergrove.game {expected_name} ({expected_code})")
          for name in sorted(set(re.findall(r'android\.permission\.[A-Z_0-9]+', manifest))):
              print("Permission reference:", name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Evergrove-Android
          path: build/evergrove.apk
          if-no-files-found: error

  visual-tests:
    name: Visual tests (independent of APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot for visual tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.4.1-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Generate Blender game models
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --background --factory-startup --python-exit-code 1 --python tools/generate_blender_assets.py -- --game-assets
          for model in house_628693 house_946e57 house_96778c house_577453 house_b76349 house_597e80 house_84905d tree pine fruit_tree bench character_head character_torso character_limb character_shoe character_hair; do
            test -s "assets/models/generated/$model.glb"
          done
      - name: Import project
        shell: bash
        run: |
          godot --headless --editor --path . --import
          python3 tools/compress_model_textures.py
          godot --headless --editor --path . --import
      - name: Render all presets using the Mobile renderer
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-render-profile
          EVERGROVE_PREVIEWS: ${{ runner.temp }}/evergrove-previews
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers
          timeout --signal=TERM --kill-after=10s 240s xvfb-run -a godot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 960x540 --path . --script res://tests/render_visuals.gd 2>&1 | tee "$RUNNER_TEMP/render.log"
          grep -Fx 'Rendered preset failures: 0' "$RUNNER_TEMP/render.log"
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' "$RUNNER_TEMP/render.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Evergrove-Visual-Previews
          path: |
            ${{ runner.temp }}/evergrove-previews/*.png
            ${{ runner.temp }}/render.log
          if-no-files-found: warn
