name: Desktop performance smoke test
on:
  push:
    branches: ['test/desktop-performance']
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Generate and import assets
        run: |
          blender --background --factory-startup --python-exit-code 1 --python tools/generate_blender_assets.py -- --game-assets
          godot --headless --editor --path . --import
          python3 tools/compress_model_textures.py
          godot --headless --editor --path . --import
      - name: Desktop OpenGL benchmark at 1280x720
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/evergrove-desktop-profile
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' godot --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --path . --script res://tests/desktop_benchmark.gd 2>&1 | tee desktop-benchmark.txt
          test "$(grep -c 'BENCH preset=' desktop-benchmark.txt)" -eq 4
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' desktop-benchmark.txt; then exit 1; fi
          grep 'BENCH ' desktop-benchmark.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-benchmark
          path: desktop-benchmark.txt
